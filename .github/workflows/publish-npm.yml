# Publishes @propraven/sdk to npm when a GitHub release is published.
# It can also be run manually to re-publish in case it failed for some reason:
# https://github.com/jdw2111/propraven-typescript/actions/workflows/publish-npm.yml
#
# npm trusted publishing (OIDC) is bound to this workflow FILE NAME; keep the name, the
# triggers and `id-token: write`. If the package.json version is already on npm it skips.
name: Publish NPM
on:
  workflow_dispatch:

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run generate:check
          npm run typecheck
          npm test

      - name: Publish to NPM
        run: |
          bash ./bin/publish-npm
